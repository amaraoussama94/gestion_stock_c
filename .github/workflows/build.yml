# ✅ Defines a GitHub Actions workflow named "C Build and Release"
# 💡 This workflow automates compiling your C program for both Linux and Windows,
#    manages versioning, uploads release binaries, and syncs them to a test repository.

name: C Build and Release

on:
  push:
    branches:
      - master  # 🚀 Triggers this workflow when code is pushed to the master branch

jobs:
  build:
    name: Build and Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.new_version }}  # ✅ Makes the bumped version available to downstream jobs

    steps:
      # 📥 Downloads your repository to the GitHub runner
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: master
          fetch-depth: 0  # 🔎 Ensures full git history is available (important for gcovr and tagging)

      # 🛠 Installs required compilation tools
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential make

      # 🧰 Installs MinGW to allow cross-compilation for Windows
      - name: Install MinGW cross-compiler
        run: sudo apt-get install -y mingw-w64

      # 📈 Reads current version, bumps it (e.g. v1.02 → v1.03), and saves for reuse
      - name: Read and bump version
        id: version
        run: |
          VERSION=$(cat version.txt | tr -d 'v')
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          NEW_MINOR=$(printf "%02d" $((10#$MINOR + 1)))
          NEW_VERSION="v$MAJOR.$NEW_MINOR"
          echo "$NEW_VERSION" > version.txt
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      # 🧪 Builds Linux binary with embedded version macro
      - name: Build Linux binary
        run: |
          VERSION=$(cat version.txt | tr -d 'v')
          make ci-build VERSION=$VERSION

      # 🖥 Builds Windows binary with embedded version macro
      - name: Build Windows binary
        run: |
          VERSION=$(cat version.txt | tr -d 'v')
          make ci-build-windows VERSION=$VERSION

      # ✅ Verifies that the binaries were successfully created
      - name: Check binaries exist
        run: |
          VERSION=${{ steps.version.outputs.new_version }}
          [ -f "build/gestion_stock_${VERSION}" ] || { echo "Linux binary missing"; exit 1; }
          [ -f "build/gestion_stock_${VERSION}.exe" ] || { echo "Windows binary missing"; exit 1; }

      # 🚚 Upload binaries as artifacts so other jobs can access them
      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synced-binaries
          path: |
            build/gestion_stock_${{ steps.version.outputs.new_version }}
            build/gestion_stock_${{ steps.version.outputs.new_version }}.exe

      # 🔖 Creates and pushes the version tag (e.g. PROD_VERSION_v1.03) if it doesn't already exist
      - name: Check and bump version + create tag
        run: |
          CURRENT_VERSION=$(cat version.txt | tr -d 'v')
          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          NEW_MINOR=$(printf "%02d" $((10#$MINOR + 1)))
          NEW_VERSION="v${MAJOR}.${NEW_MINOR}"
          TAG="PROD_VERSION_${NEW_VERSION}"

          git fetch --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping version bump."
          else
            git config user.name "CI Release Tagger"
            git config user.email "ci@release-tagger.com"
            git add version.txt
            git commit -m "🔖 Bump version to $NEW_VERSION"
            git tag -a "$TAG" -m "Release $NEW_VERSION"
            git push origin "$TAG"
            git push origin master

  push-to-test-repo:
    name: Push Binaries to Test Repo
    needs: build  # ✅ Depends on completion of the build job
    runs-on: ubuntu-latest

    steps:
      # 📦 Downloads the binaries saved as CI artifacts
      - name: Download binaries from build job
        uses: actions/download-artifact@v4
        with:
          name: synced-binaries

      # 🔄 Clones your external test repository
      - name: Clone Test Repo
        run: |
          git clone https://x-access-token:${{ secrets.TEST_REPO_PUSH_TOKEN }}@github.com/amaraoussama94/Test_Auto_gestion_stock_c.git test_repo

      # 📁 Copies the binaries into the test repo's build/ folder
      - name: Copy binaries into test repo
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          echo "Using version: $VERSION"
          mkdir -p test_repo/build/
          cp gestion_stock_${VERSION} test_repo/build/gestion_stock_linux
          cp gestion_stock_${VERSION}.exe test_repo/build/gestion_stock.exe

      # 🔐 Commits and pushes the binaries into your test repo
      - name: Commit and push to test repo
        run: |
          cd test_repo
          git config user.name "CI Binary Sync"
          git config user.email "ci@binary-sync.com"
          git add build/
          git commit -m "🔄 Sync binaries from gestion_stock_c [${{ needs.build.outputs.version }}]" || echo "No changes to commit"
          git remote set-url origin https://x-access-token:${{ secrets.TEST_REPO_PUSH_TOKEN }}@github.com/amaraoussama94/Test_Auto_gestion_stock_c.git
          git push origin main --force

  # 🎉 Final job to publish binaries to GitHub Release *after test repo sync succeeds*
  create-release:
    name: Create GitHub Release
    needs: push-to-test-repo
    runs-on: ubuntu-latest

    steps:
      # 📥 Downloads your repo (optional but good practice before release)
      - name: Checkout code
        uses: actions/checkout@v3

      # 📤 Uploads binaries to GitHub Release using the created version tag
      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: PROD_VERSION_${{ needs.build.outputs.version }}
          name: "Release ${{ needs.build.outputs.version }}"
          create_release: true
          files: |
            build/gestion_stock_${{ needs.build.outputs.version }}
            build/gestion_stock_${{ needs.build.outputs.version }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
